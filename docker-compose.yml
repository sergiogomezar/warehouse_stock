services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: warehouse
      POSTGRES_PASSWORD: warehouse
      POSTGRES_DB: warehouse_stock
    ports:
      - '5432:5432'
    volumes:
      - postgres-data:/var/lib/postgresql/data
      # Creates the warehouse_stock_test database used by the e2e tests.
      - ./docker/postgres-init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U warehouse -d warehouse_stock']
      interval: 2s
      timeout: 5s
      retries: 15

volumes:
  postgres-data:
